<!doctype html>
<!-- Replace the placeholder below with your NEW TomTom key. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bangladesh Navigator</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .panel {
      position: fixed;
      z-index: 1000;
      top: 20px;
      left: 20px;
      width: 340px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.22);
    }

    h1 {
      margin: 0 0 4px;
      color: #07543c;
      font-size: 23px;
    }

    .subtitle {
      margin: 0 0 16px;
      color: #65736e;
      font-size: 12px;
    }

    label {
      display: block;
      margin: 12px 0 5px;
      color: #4b5e57;
      font-size: 11px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      height: 42px;
      padding: 0 11px;
      border: 1px solid #d8e1dc;
      border-radius: 11px;
      font-size: 13px;
    }

    input,
    select {
      background: #fff;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #0f7a55;
      box-shadow: 0 0 0 3px rgba(15, 122, 85, 0.12);
    }

    button {
      border: 0;
      color: #fff;
      background: #0f7a55;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #07543c;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 9px;
    }

    .secondary {
      color: #31594b;
      background: #edf5f0;
    }

    .secondary:hover {
      background: #dfeee5;
    }

    .route-button {
      margin-top: 13px;
      background: linear-gradient(135deg, #07543c, #0f9363);
    }

    .result {
      display: none;
      margin-top: 14px;
      padding: 13px;
      border: 1px solid #d6e8dc;
      border-radius: 13px;
      background: #f1faef;
    }

    .result.show {
      display: block;
    }

    .result-title {
      margin-bottom: 10px;
      color: #07543c;
      font-size: 14px;
      font-weight: bold;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .metric {
      padding: 8px 5px;
      border-radius: 9px;
      background: #fff;
      text-align: center;
    }

    .metric strong {
      display: block;
      color: #10231d;
      font-size: 14px;
    }

    .metric span {
      color: #718079;
      font-size: 9px;
    }

    .traffic-message {
      margin-top: 9px;
      padding: 8px;
      border-radius: 9px;
      color: #07543c;
      background: #dcf5e5;
      font-size: 11px;
      font-weight: bold;
    }

    .traffic-message.slow {
      color: #8a3500;
      background: #ffe1ce;
    }

    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
      padding: 10px;
      border-radius: 11px;
      background: #f2f5f3;
      color: #64726d;
      font-size: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .line {
      width: 24px;
      height: 5px;
      border-radius: 99px;
    }

    .green {
      background: #2ae57b;
    }

    .yellow {
      background: #ffc105;
    }

    .red {
      background: #fb2d09;
    }

    .dark-red {
      background: #ad0000;
    }

    .map-buttons {
      position: fixed;
      z-index: 1000;
      top: 20px;
      right: 20px;
      display: grid;
      gap: 8px;
    }

    .map-buttons button {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 14px;
      color: #174d3b;
      background: #fff;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
      font-size: 20px;
    }

    .map-buttons button.active {
      color: #fff;
      background: #0f7a55;
    }

    .status {
      margin-top: 10px;
      color: #6b7773;
      font-size: 10px;
      line-height: 1.5;
    }

    .marker-label {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 3px solid white;
      border-radius: 50%;
      color: white;
      background: #0f7a55;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      font-weight: bold;
    }

    .marker-label.end {
      border-radius: 9px;
      background: #d75140;
    }

    @media (max-width: 700px) {
      .panel {
        top: auto;
        right: 8px;
        bottom: 8px;
        left: 8px;
        width: auto;
        max-height: 57vh;
        border-radius: 18px;
      }

      .map-buttons {
        top: 10px;
        right: 10px;
      }

      .map-buttons button {
        width: 43px;
        height: 43px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="map-buttons">
    <button id="trafficButton" title="Show or hide traffic">🚦</button>
    <button id="gpsButton" title="Use my GPS location">📍</button>
  </div>

  <main class="panel">
    <h1>Bangladesh Navigator</h1>
    <p class="subtitle">TomTom live traffic and traffic-aware routes</p>

    <label for="vehicle">Vehicle</label>
    <select id="vehicle">
      <option value="motorcycle">🏍️ Motorcycle</option>
      <option value="rickshaw">🛺 Rickshaw</option>
      <option value="cng">🚕 CNG</option>
      <option value="car" selected>🚗 Car</option>
      <option value="bus">🚌 Bus</option>
      <option value="truck">🚚 Truck</option>
      <option value="ambulance">🚑 Ambulance</option>
    </select>

    <label for="startInput">Starting place</label>
    <input
      id="startInput"
      placeholder="Example: Mirpur 10, Dhaka"
      autocomplete="off"
    >

    <label for="endInput">Destination</label>
    <input
      id="endInput"
      placeholder="Example: Motijheel, Dhaka"
      autocomplete="off"
    >

    <div class="row">
      <button class="secondary" id="pickStartButton">
        Pick start
      </button>

      <button class="secondary" id="pickEndButton">
        Pick destination
      </button>
    </div>

    <div class="row">
      <button class="secondary" id="locationButton">
        My GPS
      </button>

      <button class="secondary" id="swapButton">
        Swap
      </button>
    </div>

    <button class="route-button" id="routeButton">
      Find live-traffic route
    </button>

    <section class="result" id="result">
      <div class="result-title" id="resultTitle">
        Best route
      </div>

      <div class="metrics">
        <div class="metric">
          <strong id="distance">—</strong>
          <span>Distance</span>
        </div>

        <div class="metric">
          <strong id="duration">—</strong>
          <span>Travel time</span>
        </div>

        <div class="metric">
          <strong id="delay">—</strong>
          <span>Traffic delay</span>
        </div>
      </div>

      <div class="traffic-message" id="trafficMessage">
        Live traffic checked
      </div>
    </section>

    <div class="legend">
      <div class="legend-item">
        <span class="line green"></span>
        Clear
      </div>

      <div class="legend-item">
        <span class="line yellow"></span>
        Slow
      </div>

      <div class="legend-item">
        <span class="line red"></span>
        Heavy
      </div>

      <div class="legend-item">
        <span class="line dark-red"></span>
        Closed
      </div>
    </div>

    <div class="status" id="status">
      Paste your new TomTom key in TOMTOM_KEY. Then click the map
      to select the start and destination.
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const TOMTOM_KEY = "1ygn1YPd8JOFbrvsnkaOAa24Pny7wJyn";

    const vehicleTimeFactor = {
      motorcycle: 1.05,
      rickshaw: 2.1,
      cng: 1.15,
      car: 1,
      bus: 1.3,
      truck: 1.45,
      ambulance: 0.9
    };

    const map = L.map("map").setView([23.8103, 90.4125], 12);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | Traffic &copy; TomTom'
      }
    ).addTo(map);

    const trafficLayer = L.tileLayer(
      "https://api.tomtom.com/maps/orbis/traffic/tile/flow/{z}/{x}/{y}.png" +
      "?apiVersion=1" +
      "&style=light" +
      "&tileSize=256" +
      "&key=" + encodeURIComponent(TOMTOM_KEY),
      {
        maxZoom: 22,
        opacity: 0.9
      }
    );

    const state = {
      start: null,
      end: null,
      startMarker: null,
      endMarker: null,
      routeLayers: [],
      picking: "start",
      trafficVisible: false
    };

    const elements = {
      startInput: document.getElementById("startInput"),
      endInput: document.getElementById("endInput"),
      vehicle: document.getElementById("vehicle"),
      routeButton: document.getElementById("routeButton"),
      trafficButton: document.getElementById("trafficButton"),
      gpsButton: document.getElementById("gpsButton"),
      locationButton: document.getElementById("locationButton"),
      pickStartButton: document.getElementById("pickStartButton"),
      pickEndButton: document.getElementById("pickEndButton"),
      swapButton: document.getElementById("swapButton"),
      status: document.getElementById("status"),
      result: document.getElementById("result"),
      resultTitle: document.getElementById("resultTitle"),
      distance: document.getElementById("distance"),
      duration: document.getElementById("duration"),
      delay: document.getElementById("delay"),
      trafficMessage: document.getElementById("trafficMessage")
    };

    function hasValidKey() {
      return (
        TOMTOM_KEY &&
        !TOMTOM_KEY.includes("PASTE_YOUR")
      );
    }

    function setStatus(message, error = false) {
      elements.status.textContent = message;
      elements.status.style.color = error ? "#b22f24" : "#6b7773";
    }

    function formatTime(seconds) {
      const totalMinutes = Math.max(1, Math.round(seconds / 60));

      if (totalMinutes < 60) {
        return totalMinutes + " min";
      }

      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      return hours + "h " + minutes + "m";
    }

    function markerIcon(type) {
      return L.divIcon({
        className: "",
        html:
          '<div class="marker-label ' +
          (type === "end" ? "end" : "") +
          '">' +
          (type === "start" ? "A" : "B") +
          "</div>",
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });
    }

    function setPoint(type, point, label) {
      state[type] = {
        lat: Number(point.lat),
        lng: Number(point.lng)
      };

      const markerName =
        type === "start" ? "startMarker" : "endMarker";

      if (state[markerName]) {
        map.removeLayer(state[markerName]);
      }

      state[markerName] = L.marker(
        [state[type].lat, state[type].lng],
        {
          icon: markerIcon(type),
          draggable: true
        }
      ).addTo(map);

      state[markerName].on("dragend", function (event) {
        const moved = event.target.getLatLng();

        setPoint(
          type,
          moved,
          moved.lat.toFixed(5) + ", " + moved.lng.toFixed(5)
        );
      });

      if (type === "start") {
        elements.startInput.value =
          label ||
          state.start.lat.toFixed(5) +
          ", " +
          state.start.lng.toFixed(5);

        state.picking = "end";
        setStatus("Now select your destination.");
      } else {
        elements.endInput.value =
          label ||
          state.end.lat.toFixed(5) +
          ", " +
          state.end.lng.toFixed(5);

        setStatus("Ready to find the live-traffic route.");
      }
    }

    function clearRouteLayers() {
      state.routeLayers.forEach(function (layer) {
        map.removeLayer(layer);
      });

      state.routeLayers = [];
    }

    function toggleTraffic() {
      if (!hasValidKey()) {
        setStatus(
          "Paste your new TomTom key in TOMTOM_KEY first.",
          true
        );
        return;
      }

      if (state.trafficVisible) {
        map.removeLayer(trafficLayer);
        state.trafficVisible = false;
        elements.trafficButton.classList.remove("active");
        setStatus("Live traffic hidden.");
      } else {
        trafficLayer.addTo(map);
        state.trafficVisible = true;
        elements.trafficButton.classList.add("active");
        setStatus("TomTom live traffic is visible.");
      }
    }

    function useGPS() {
      if (!navigator.geolocation) {
        setStatus("GPS is not supported by this browser.", true);
        return;
      }

      setStatus("Finding your GPS location...");

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const point = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          setPoint("start", point, "My current location");
          map.setView([point.lat, point.lng], 16);
          setStatus("GPS location selected as starting place.");
        },
        function () {
          setStatus(
            "Allow location permission and try again.",
            true
          );
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 20000
        }
      );
    }

    async function geocode(placeName) {
      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&limit=1" +
        "&countrycodes=bd" +
        "&q=" +
        encodeURIComponent(placeName);

      const response = await fetch(url, {
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("Place search failed.");
      }

      const results = await response.json();

      if (!results.length) {
        throw new Error(
          'Could not find "' + placeName + '" in Bangladesh.'
        );
      }

      return {
        lat: Number(results[0].lat),
        lng: Number(results[0].lon),
        label: results[0].display_name
      };
    }

    async function ensurePoints() {
      if (
        !state.start &&
        elements.startInput.value.trim()
      ) {
        const startPlace = await geocode(
          elements.startInput.value.trim()
        );

        setPoint(
          "start",
          startPlace,
          startPlace.label
        );
      }

      if (
        !state.end &&
        elements.endInput.value.trim()
      ) {
        const endPlace = await geocode(
          elements.endInput.value.trim()
        );

        setPoint(
          "end",
          endPlace,
          endPlace.label
        );
      }

      if (!state.start || !state.end) {
        throw new Error(
          "Select both starting place and destination."
        );
      }
    }

    function normalizeRoute(route) {
      const points = [];

      (route.legs || []).forEach(function (leg, legIndex) {
        (leg.points || []).forEach(function (
          point,
          pointIndex
        ) {
          if (
            legIndex > 0 &&
            pointIndex === 0 &&
            points.length
          ) {
            return;
          }

          points.push([
            point.latitude,
            point.longitude
          ]);
        });
      });

      return {
        points: points,
        distance: route.summary.lengthInMeters,
        duration: route.summary.travelTimeInSeconds,
        delay: route.summary.trafficDelayInSeconds || 0
      };
    }

    function displayRoutes(routes) {
      clearRouteLayers();

      routes.slice(1).forEach(function (route) {
        const alternative = L.polyline(
          route.points,
          {
            color: "#71877f",
            weight: 5,
            opacity: 0.55,
            dashArray: "8 9"
          }
        ).addTo(map);

        state.routeLayers.push(alternative);
      });

      const bestRoute = routes[0];

      const routeBorder = L.polyline(
        bestRoute.points,
        {
          color: "#ffffff",
          weight: 11,
          opacity: 0.95
        }
      ).addTo(map);

      const routeLine = L.polyline(
        bestRoute.points,
        {
          color: "#087852",
          weight: 6,
          opacity: 1
        }
      ).addTo(map);

      state.routeLayers.push(routeBorder, routeLine);

      map.fitBounds(routeLine.getBounds(), {
        padding: [45, 45]
      });

      const vehicleFactor =
        vehicleTimeFactor[elements.vehicle.value] || 1;

      const adjustedDuration =
        bestRoute.duration * vehicleFactor;

      const delayMinutes = Math.max(
        0,
        Math.round(bestRoute.delay / 60)
      );

      elements.distance.textContent =
        bestRoute.distance < 10000
          ? (bestRoute.distance / 1000).toFixed(1) + " km"
          : Math.round(bestRoute.distance / 1000) + " km";

      elements.duration.textContent =
        formatTime(adjustedDuration);

      elements.delay.textContent =
        delayMinutes > 0
          ? "+" + delayMinutes + " min"
          : "0 min";

      elements.resultTitle.textContent =
        routes.length > 1
          ? "Best of " + routes.length + " routes"
          : "Best route";

      elements.trafficMessage.classList.toggle(
        "slow",
        delayMinutes >= 2
      );

      elements.trafficMessage.textContent =
        delayMinutes > 0
          ? "Live traffic adds about " +
            delayMinutes +
            " minutes."
          : "No major live traffic delay detected.";

      elements.result.classList.add("show");
    }

    async function findRoute() {
      if (!hasValidKey()) {
        setStatus(
          "Paste your new TomTom key in TOMTOM_KEY first.",
          true
        );
        return;
      }

      elements.routeButton.disabled = true;
      elements.routeButton.textContent =
        "Checking live traffic...";

      try {
        await ensurePoints();

        const routePoints =
          state.start.lat +
          "," +
          state.start.lng +
          ":" +
          state.end.lat +
          "," +
          state.end.lng;

        const query = new URLSearchParams({
          key: TOMTOM_KEY,
          apiVersion: "2",
          maxAlternatives: "2",
          alternativeType: "anyRoute",
          routeRepresentation: "polyline",
          sectionType: "traffic",
          departAt: "now",
          routeType: "fast",
          traffic: "live",
          travelMode: "car"
        });

        const url =
          "https://api.tomtom.com/maps/orbis/routing/" +
          "calculateRoute/" +
          routePoints +
          "/json?" +
          query.toString();

        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.detailedError?.message ||
            "TomTom route request failed."
          );
        }

        if (!data.routes || !data.routes.length) {
          throw new Error(
            "No route was found between these places."
          );
        }

        const routes = data.routes
          .map(normalizeRoute)
          .filter(function (route) {
            return route.points.length > 1;
          });

        if (!routes.length) {
          throw new Error(
            "TomTom returned no route geometry."
          );
        }

        displayRoutes(routes);
        setStatus("Live-traffic route loaded.");
      } catch (error) {
        setStatus(
          error.message || "Could not find the route.",
          true
        );
      } finally {
        elements.routeButton.disabled = false;
        elements.routeButton.textContent =
          "Find live-traffic route";
      }
    }

    function swapPlaces() {
      const oldStart = state.start;
      const oldEnd = state.end;
      const oldStartText = elements.startInput.value;
      const oldEndText = elements.endInput.value;

      if (state.startMarker) {
        map.removeLayer(state.startMarker);
      }

      if (state.endMarker) {
        map.removeLayer(state.endMarker);
      }

      state.start = null;
      state.end = null;
      state.startMarker = null;
      state.endMarker = null;

      elements.startInput.value = "";
      elements.endInput.value = "";

      if (oldEnd) {
        setPoint("start", oldEnd, oldEndText);
      } else {
        elements.startInput.value = oldEndText;
      }

      if (oldStart) {
        setPoint("end", oldStart, oldStartText);
      } else {
        elements.endInput.value = oldStartText;
      }

      clearRouteLayers();
      elements.result.classList.remove("show");
    }

    map.on("click", function (event) {
      setPoint(state.picking, event.latlng);
    });

    elements.startInput.addEventListener(
      "input",
      function () {
        state.start = null;
      }
    );

    elements.endInput.addEventListener(
      "input",
      function () {
        state.end = null;
      }
    );

    elements.pickStartButton.addEventListener(
      "click",
      function () {
        state.picking = "start";
        setStatus("Tap the map to select starting place.");
      }
    );

    elements.pickEndButton.addEventListener(
      "click",
      function () {
        state.picking = "end";
        setStatus("Tap the map to select destination.");
      }
    );

    elements.routeButton.addEventListener(
      "click",
      findRoute
    );

    elements.trafficButton.addEventListener(
      "click",
      toggleTraffic
    );

    elements.gpsButton.addEventListener(
      "click",
      useGPS
    );

    elements.locationButton.addEventListener(
      "click",
      useGPS
    );

    elements.swapButton.addEventListener(
      "click",
      swapPlaces
    );

    if (hasValidKey()) {
      trafficLayer.addTo(map);
      state.trafficVisible = true;
      elements.trafficButton.classList.add("active");
      setStatus(
        "Live traffic is active. Select start and destination."
      );
    }

    setInterval(function () {
      if (state.trafficVisible) {
        trafficLayer.redraw();
      }
    }, 60000);
  </script>
</body>
</html>
